name: R3.2 Status Snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r32-status-snapshot.yml"

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: d13bc04383c8cc59b2cc418fe48c9ef0756b2a6a
      TARGET_WORKFLOW: phase3-retrieval-r32.yml
      STATUS_BRANCH: phase3-r32-status-snapshot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Query R3.2 workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/r32-status"
          mkdir -p "${root}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=push&head_sha=${TARGET_SHA}&per_page=10"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" > "${root}/runs.json"
          jq '{total_count, workflow_runs: [.workflow_runs[] | {id, name, head_sha, event, status, conclusion, run_number, run_attempt, created_at, updated_at, html_url, jobs_url, artifacts_url}]}' \
            "${root}/runs.json" > "${root}/status.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "${TARGET_SHA}"
          git switch -C "${STATUS_BRANCH}"
          mkdir -p benchmarks/retrieval/status_snapshot/r32
          cp "${root}/status.json" benchmarks/retrieval/status_snapshot/r32/status.json
          git add benchmarks/retrieval/status_snapshot/r32/status.json
          git commit -m "Snapshot R3.2 workflow status"
          git push --force origin "HEAD:refs/heads/${STATUS_BRANCH}"
