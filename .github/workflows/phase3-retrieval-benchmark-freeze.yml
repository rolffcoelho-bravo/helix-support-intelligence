name: Phase 3 Retrieval Benchmark Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase3-retrieval-benchmark-freeze.yml"
      - "configs/data/banking77.json"
      - "configs/retrieval/phase3_benchmark_v1.json"
      - "src/helix_support_intelligence/data/banking77.py"
      - "src/helix_support_intelligence/data/helixbank.py"
      - "src/helix_support_intelligence/retrieval/**"
      - "scripts/materialize_retrieval_benchmark.py"
      - "tests/test_phase3_retrieval_benchmark.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-retrieval-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    name: Materialize development surface and hash sealed retrieval split
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Verify retrieval benchmark source
        run: |
          uv run ruff check \
            src/helix_support_intelligence/retrieval \
            scripts/materialize_retrieval_benchmark.py \
            tests/test_phase3_retrieval_benchmark.py
          uv run pytest tests/test_phase3_retrieval_benchmark.py

      - name: Materialize benchmark hashes without confirmatory query export
        run: |
          mkdir -p artifacts/phase3-retrieval/benchmark-freeze
          uv run python scripts/materialize_retrieval_benchmark.py \
            --output artifacts/phase3-retrieval/benchmark-freeze \
            | tee artifacts/phase3-retrieval/benchmark-freeze/run-output.txt
          test ! -f artifacts/phase3-retrieval/benchmark-freeze/confirmatory_queries.jsonl
          test ! -f artifacts/phase3-retrieval/benchmark-freeze/confirmatory_qrels.jsonl

      - name: Publish hash manifest summary
        run: cat artifacts/phase3-retrieval/benchmark-freeze/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark-freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-retrieval-benchmark-freeze-${{ github.sha }}
          path: artifacts/phase3-retrieval/benchmark-freeze/
          if-no-files-found: error
          retention-days: 90
