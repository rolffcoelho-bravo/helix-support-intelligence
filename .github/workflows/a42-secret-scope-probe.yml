name: A4.2 secret scope probe

on:
  push:
    branches:
      - phase4-a42-secret-scope-probe
    paths:
      - ".github/workflows/a42-secret-scope-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-a42-secret-scope-probe
      - name: Check secret presence without exposing value
        run: |
          mkdir -p benchmarks/assistance/results
          if test -n "$OPENAI_API_KEY"; then
            present=true
          else
            present=false
          fi
          printf '{\n  "probe": "a42_repository_secret_scope",\n  "openai_api_key_present": %s\n}\n' "$present" \
            > benchmarks/assistance/results/a42_secret_scope_probe.json
          if test "$present" != true; then
            exit 1
          fi
      - name: Commit probe result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- benchmarks/assistance/results/a42_secret_scope_probe.json
          git commit -m "Record A4.2 secret scope probe" || exit 0
          git push origin HEAD:phase4-a42-secret-scope-probe

# Temporary operational probe only. It never prints or persists the secret value.
# Probe rerun after repository secret value refresh on 2026-08-20.
