name: Phase 2 Routing Baselines

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase2-routing-baselines.yml"
      - "benchmarks/routing/**"
      - "configs/data/banking77.json"
      - "configs/models/routing_ladder.json"
      - "src/helix_support_intelligence/data/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-routing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a0-a1-validation:
    name: A0/A1 frozen validation benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Run A0/A1 validation benchmark
        run: >-
          uv run benchmarks/routing/evaluate_a0_a1.py
          --output-dir artifacts/phase2-routing/a0-a1

      - name: Publish benchmark summary
        run: cat artifacts/phase2-routing/a0-a1/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-routing-a0-a1-${{ github.sha }}
          path: artifacts/phase2-routing/a0-a1/
          if-no-files-found: error
          retention-days: 14
