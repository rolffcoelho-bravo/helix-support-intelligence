name: A4.2 recovery status snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/a42-recovery-status-now.yml"

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD_SHA: 0cfe1edd7fe955a5d0ce57b8f68df2b8c183afb9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Snapshot recovery run
        run: |
          set -euo pipefail
          mkdir -p benchmarks/assistance/results
          data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/a42-owner-secret-probe.yml/runs?per_page=20")"
          row="$(printf '%s' "$data" | jq -c --arg sha "$TARGET_HEAD_SHA" '[.workflow_runs[] | select(.head_sha==$sha)][0] // {}')"
          if test "$row" = "{}"; then
            echo "Recovery run not found." >&2
            exit 1
          fi
          run_id="$(printf '%s' "$row" | jq '.id')"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
          jq -n \
            --arg target_head_sha "$TARGET_HEAD_SHA" \
            --argjson run "$row" \
            --argjson artifacts "$artifacts" \
            '{snapshot:"a42_frozen_recovery", target_head_sha:$target_head_sha, run_id:$run.id, status:$run.status, conclusion:$run.conclusion, run_attempt:$run.run_attempt, created_at:$run.created_at, updated_at:$run.updated_at, artifact_count:$artifacts.total_count, artifacts:[ $artifacts.artifacts[]? | {id,name,expired,size_in_bytes} ]}' \
            > benchmarks/assistance/results/a42_recovery_status_now.json
      - name: Commit status snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -- benchmarks/assistance/results/a42_recovery_status_now.json
          git commit -m "Record A4.2 recovery status snapshot"
          git push origin HEAD:main

# Temporary operational status probe only. It never executes scientific code.
