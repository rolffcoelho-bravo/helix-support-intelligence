name: Phase 3 B1 Top-50 Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase3-b1-top50-integrity.yml"
      - "benchmarks/retrieval/hash_b1_top50.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b1-top50:
    name: Frozen B1 top-50 candidate integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Verify audit source
        run: |
          uv run ruff check benchmarks/retrieval/hash_b1_top50.py
          uv run ruff format --check benchmarks/retrieval/hash_b1_top50.py

      - name: Verify reused CPU-only scientific lock
        run: |
          test -f benchmarks/routing/evaluate_a2.py.lock
          grep -q 'https://download.pytorch.org/whl/cpu' benchmarks/routing/evaluate_a2.py.lock
          ! grep -Eiq 'name = "(nvidia|cuda|triton)' benchmarks/routing/evaluate_a2.py.lock
          cp benchmarks/routing/evaluate_a2.py.lock benchmarks/retrieval/hash_b1_top50.py.lock

      - name: Reproduce frozen development benchmark surface
        run: |
          set -o pipefail
          mkdir -p artifacts/phase3-retrieval/benchmark
          uv run python scripts/materialize_retrieval_benchmark.py \
            --output artifacts/phase3-retrieval/benchmark \
            | tee artifacts/phase3-retrieval/benchmark/run-output.txt
          test ! -f artifacts/phase3-retrieval/benchmark/confirmatory_queries.jsonl
          test ! -f artifacts/phase3-retrieval/benchmark/confirmatory_qrels.jsonl

      - name: Compute B1 full and top-50 ranking hashes
        run: |
          set -o pipefail
          uv run --locked benchmarks/retrieval/hash_b1_top50.py \
            --input-dir artifacts/phase3-retrieval/benchmark \
            | tee artifacts/phase3-retrieval/b1-top50-hashes.json

      - name: Remove transient lock copy
        if: always()
        run: rm -f benchmarks/retrieval/hash_b1_top50.py.lock

      - name: Upload integrity evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-b1-top50-integrity-${{ github.sha }}
          path: artifacts/phase3-retrieval/b1-top50-hashes.json
          if-no-files-found: error
          retention-days: 90
