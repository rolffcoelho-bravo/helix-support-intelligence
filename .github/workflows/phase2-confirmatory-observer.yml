name: Phase 2 Confirmatory Observer

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    name: Recover one-shot confirmatory evidence
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 6 &&
      github.event.comment.body == 'OBSERVE_CONFIRMATORY_RUN_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Locate confirmatory bridge run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=issue_comment&per_page=50" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/phase2-routing-confirmatory-approval-bridge.yml") | .id' \
            | head -n 1)
          if [ -z "$RUN_ID" ]; then
            echo "No confirmatory bridge run found" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" > run.json
          STATUS=$(jq -r '.status' run.json)
          CONCLUSION=$(jq -r '.conclusion // "pending"' run.json)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"

      - name: Download confirmatory artifact when successful
        if: steps.locate.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh run download "${{ steps.locate.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir evidence
          find evidence -maxdepth 4 -type f -print

      - name: Publish observer result to PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          STATUS: ${{ steps.locate.outputs.status }}
          CONCLUSION: ${{ steps.locate.outputs.conclusion }}
        run: |
          {
            echo "PHASE2_CONFIRMATORY_OBSERVER"
            echo
            echo "Run ID: $RUN_ID"
            echo "Status: $STATUS"
            echo "Conclusion: $CONCLUSION"
            echo
            if [ "$CONCLUSION" = "success" ]; then
              RESULTS=$(find evidence -name results.json -print -quit)
              REPORT=$(find evidence -name report.md -print -quit)
              if [ -n "$REPORT" ]; then
                cat "$REPORT"
                echo
              fi
              if [ -n "$RESULTS" ]; then
                echo '<details><summary>Authoritative results.json</summary>'
                echo
                echo '```json'
                cat "$RESULTS"
                echo '```'
                echo '</details>'
              fi
            else
              echo "The observer did not rerun the scientific evaluation. Inspect the recorded run before any retry decision."
            fi
          } > observer-comment.md
          jq -Rs '{body: .}' observer-comment.md \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/6/comments" --input -
