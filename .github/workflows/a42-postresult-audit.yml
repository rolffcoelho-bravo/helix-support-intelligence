name: A4.2 post-result forensic audit

on:
  push:
    branches:
      - phase4-a42-postresult-audit
    paths:
      - ".github/workflows/a42-postresult-audit.yml"
      - "benchmarks/assistance/run_verify_a42_postresult_v1.py"
      - "benchmarks/assistance/audit_a42_forensic_v1.py"
      - "benchmarks/assistance/run_audit_a42_forensic_v1_fix.py"

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-a42-postresult-audit

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install repository environment
        run: uv sync --locked --group dev

      - name: Download and verify immutable raw A4.2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/a42 artifacts/phase4-assistance/a42
          gh api \
            repos/rolffcoelho-bravo/helix-support-intelligence/actions/artifacts/9415920431/zip \
            > /tmp/a42/raw.zip
          echo "376537ebac7800ae9f4f3b3802fcc31a03672f040c3648674f712e7014bb4ca5  /tmp/a42/raw.zip" \
            | sha256sum -c -
          unzip -q /tmp/a42/raw.zip -d artifacts/phase4-assistance/a42

      - name: Bind post-result verifier to frozen A4.1 dependency lock
        run: |
          cp benchmarks/assistance/runtime_a41.py.lock \
            benchmarks/assistance/run_verify_a42_postresult_v1.py.lock
          cmp benchmarks/assistance/runtime_a41.py.lock \
            benchmarks/assistance/run_verify_a42_postresult_v1.py.lock

      - name: Reconstruct registered metrics without rerunning candidates
        run: >-
          uv run --locked benchmarks/assistance/run_verify_a42_postresult_v1.py
          --output-dir artifacts/phase4-assistance/a42

      - name: Run forensic scientific validity audit
        run: |
          set +e
          uv run python benchmarks/assistance/run_audit_a42_forensic_v1_fix.py \
            --output-dir artifacts/phase4-assistance/a42
          code=$?
          set -e
          if test "$code" -ne 2; then
            echo "Expected forensic audit to reject selection with exit code 2; got $code" >&2
            exit 1
          fi

      - name: Freeze repaired audit evidence
        run: |
          mkdir -p benchmarks/assistance/results/a42_development_postresult_v1
          cp artifacts/phase4-assistance/a42/results.json \
            benchmarks/assistance/results/a42_development_postresult_v1/results.json
          cp artifacts/phase4-assistance/a42/report.md \
            benchmarks/assistance/results/a42_development_postresult_v1/report.md
          cp artifacts/phase4-assistance/a42/post_audit.json \
            benchmarks/assistance/results/a42_development_postresult_v1/mechanical_post_audit.json
          cp artifacts/phase4-assistance/a42/post_audit.md \
            benchmarks/assistance/results/a42_development_postresult_v1/mechanical_post_audit.md
          cp artifacts/phase4-assistance/a42/diagnostic_slices.json \
            benchmarks/assistance/results/a42_development_postresult_v1/diagnostic_slices.json
          cp artifacts/phase4-assistance/a42/forensic_audit.json \
            benchmarks/assistance/results/a42_development_postresult_v1/forensic_audit.json
          cp artifacts/phase4-assistance/a42/forensic_audit.md \
            benchmarks/assistance/results/a42_development_postresult_v1/forensic_audit.md
          cat > benchmarks/assistance/results/a42_development_postresult_v1/provenance.json <<'EOF'
          {
            "raw_run_id": 32390970870,
            "raw_job_id": 96496701904,
            "raw_artifact_id": 9415920431,
            "raw_artifact_zip_sha256": "376537ebac7800ae9f4f3b3802fcc31a03672f040c3648674f712e7014bb4ca5",
            "scientific_sha": "fec8c5c63978ccae858257e1a078029c2103943c",
            "candidate_rerun": false,
            "post_score_tuning": false,
            "repair_scope": "diagnostic zero-denominator handling plus audit-only punctuation normalization"
          }
          EOF
          find benchmarks/assistance/results/a42_development_postresult_v1 \
            -maxdepth 1 -type f ! -name checksums.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > benchmarks/assistance/results/a42_development_postresult_v1/checksums.sha256
          sha256sum -c \
            benchmarks/assistance/results/a42_development_postresult_v1/checksums.sha256

      - name: Commit post-result evidence to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            benchmarks/assistance/results/a42_development_postresult_v1 \
            benchmarks/assistance/run_verify_a42_postresult_v1.py.lock
          git commit -m "Record A4.2 forensic post-result audit" || exit 0
          git push origin HEAD:phase4-a42-postresult-audit
