name: Phase 2 Confirmatory Run Observer

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase2-confirmatory-run-observer.yml"

permissions:
  actions: read
  contents: read

jobs:
  observe:
    name: List confirmatory issue-comment runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List issue-comment workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=issue_comment&per_page=100" \
            --jq '.workflow_runs[] | [.id, .path, .name, .created_at, .status, (.conclusion // "pending")] | @tsv'
