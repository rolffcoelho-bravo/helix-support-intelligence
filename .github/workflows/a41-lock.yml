name: A4.1 dependency lock

on:
  push:
    branches:
      - phase4-a41-assistance-binding
    paths:
      - benchmarks/assistance/runtime_a41.py
      - .github/workflows/a41-lock.yml
  pull_request:
    branches:
      - main
    paths:
      - benchmarks/assistance/runtime_a41.py
      - .github/workflows/a41-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-a41-assistance-binding
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.33
      - name: Freeze benchmark runtime dependencies
        run: uv lock --script benchmarks/assistance/runtime_a41.py
      - name: Record lock digest in binding
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock = Path("benchmarks/assistance/runtime_a41.py.lock")
          binding_path = Path("configs/models/assistance_binding_a41_v1.json")
          binding = json.loads(binding_path.read_text(encoding="utf-8"))
          binding["status"] = "implemented_preflight_no_results"
          binding["benchmark_runtime"]["lock_sha256"] = hashlib.sha256(lock.read_bytes()).hexdigest()
          binding_path.write_text(json.dumps(binding, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Check local-only runtime preflight
        run: python benchmarks/assistance/runtime_a41.py --preflight
      - name: Commit exact lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- benchmarks/assistance/runtime_a41.py.lock
          git add -f -- configs/models/assistance_binding_a41_v1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Freeze A4.1 benchmark dependency lock"
          git push origin HEAD:phase4-a41-assistance-binding

