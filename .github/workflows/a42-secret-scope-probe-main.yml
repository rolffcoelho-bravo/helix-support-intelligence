name: A4.2 main secret scope probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/a42-secret-scope-probe-main.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check repository secret presence without exposing value
        run: |
          mkdir -p benchmarks/assistance/results
          if test -n "$OPENAI_API_KEY"; then
            present=true
          else
            present=false
          fi
          printf '{\n  "probe": "a42_repository_secret_scope_main",\n  "openai_api_key_present": %s\n}\n' "$present" \
            > benchmarks/assistance/results/a42_secret_scope_probe_main.json
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- benchmarks/assistance/results/a42_secret_scope_probe_main.json
          git commit -m "Record main-branch A4.2 secret scope probe"
          git push origin HEAD:main

# Temporary operational probe only. It never prints or persists the secret value.
