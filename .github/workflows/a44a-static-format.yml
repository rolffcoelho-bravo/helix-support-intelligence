name: A4.4a static format

on:
  push:
    branches:
      - phase4-a44a-compositional-grounding-protocol
    paths:
      - .github/workflows/a44a-static-format.yml
      - benchmarks/assistance/compositional_cases_a44a.py
      - scripts/preflight_phase4_a44a.py
      - tests/test_phase4_a44a_compositional_grounding.py

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-a44a-compositional-grounding-protocol
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.33
      - run: uv sync --locked --group dev
      - name: Apply Ruff normalization only
        run: |
          uv run ruff check --fix \
            benchmarks/assistance/compositional_cases_a44a.py \
            scripts/preflight_phase4_a44a.py \
            tests/test_phase4_a44a_compositional_grounding.py
          uv run ruff format \
            benchmarks/assistance/compositional_cases_a44a.py \
            scripts/preflight_phase4_a44a.py \
            tests/test_phase4_a44a_compositional_grounding.py
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            benchmarks/assistance/compositional_cases_a44a.py \
            scripts/preflight_phase4_a44a.py \
            tests/test_phase4_a44a_compositional_grounding.py
          git commit -m "Normalize A4.4a Python formatting"
          git push
