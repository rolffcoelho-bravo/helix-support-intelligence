name: Phase 3 R3.2 Autoformat

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase3-r32-autoformat.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out R3.2 branch
        uses: actions/checkout@v4
        with:
          ref: phase3-r32-retrieval-execution

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Apply repository Ruff rules
        run: |
          uv run ruff check --fix benchmarks/retrieval tests/test_phase3_retrieval_execution_plan.py || true
          python3 - <<'PY'
          from pathlib import Path

          path = Path("benchmarks/retrieval/evaluate_r32.py")
          text = path.read_text(encoding="utf-8")
          needle = (
              "from helix_support_intelligence.data.helixbank import (\n"
              "    manifest as corpus_manifest,\n"
              ")"
          )
          replacement = (
              "from helix_support_intelligence.data.helixbank import (  # noqa: E402\n"
              "    manifest as corpus_manifest,\n"
              ")"
          )
          if needle not in text:
              raise SystemExit("expected delayed corpus-manifest import not found")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
          uv run ruff format benchmarks/retrieval tests/test_phase3_retrieval_execution_plan.py
          uv run ruff check benchmarks/retrieval tests/test_phase3_retrieval_execution_plan.py
          uv run ruff format --check benchmarks/retrieval tests/test_phase3_retrieval_execution_plan.py

      - name: Freeze R3.2 script dependencies
        run: uv lock --script benchmarks/retrieval/evaluate_r32.py

      - name: Commit formatter and lock output
        run: |
          if git diff --quiet; then
            echo "No formatter or lock changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            benchmarks/retrieval \
            tests/test_phase3_retrieval_execution_plan.py
          git commit -m "Format and lock R3.2 retrieval execution"
          git push origin HEAD:phase3-r32-retrieval-execution
