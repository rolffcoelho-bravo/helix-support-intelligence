name: A4.3a static typing repair

on:
  push:
    branches:
      - phase4-a43a-validity-protocol
    paths:
      - ".github/workflows/a43a-static-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-a43a-validity-protocol
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
      - run: uv sync --locked --group dev
      - name: Apply targeted mypy-only repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "scripts/preflight_phase4_a43a.py",
              "tests/test_phase4_a43a_validity.py",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "from grounding_anchors_a43a import (  # noqa: E402",
                  "from grounding_anchors_a43a import (  # type: ignore[import-not-found]  # noqa: E402",
                  1,
              )
              if name.startswith("scripts/"):
                  text = text.replace(
                      'int(row["relevance"]) >= 2',
                      'int(str(row["relevance"])) >= 2',
                      1,
                  )
              path.write_text(text, encoding="utf-8")
          PY
          uv run ruff check --fix \
            scripts/preflight_phase4_a43a.py \
            tests/test_phase4_a43a_validity.py
          uv run ruff format \
            scripts/preflight_phase4_a43a.py \
            tests/test_phase4_a43a_validity.py
          uv run mypy scripts/preflight_phase4_a43a.py tests/test_phase4_a43a_validity.py
      - name: Commit static typing repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/preflight_phase4_a43a.py tests/test_phase4_a43a_validity.py
          git commit -m "Repair A4.3a static typing" || exit 0
          git push origin HEAD:phase4-a43a-validity-protocol
