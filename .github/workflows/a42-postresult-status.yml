name: A4.2 post-result status snapshot

on:
  push:
    branches:
      - phase4-a42-postresult-audit
    paths:
      - ".github/workflows/a42-postresult-status.yml"

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-a42-postresult-audit
      - name: Locate audit run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmarks/assistance/results
          gh api 'repos/rolffcoelho-bravo/helix-support-intelligence/actions/runs?head_sha=def9b6104922284b536430524e745cefc19bc12d&event=push' \
            --jq '[.workflow_runs[] | select(.name == "A4.2 post-result forensic audit")][0] | {run_id: .id, status: .status, conclusion: .conclusion, run_attempt: .run_attempt, created_at: .created_at, updated_at: .updated_at}' \
            > benchmarks/assistance/results/a42_postresult_status.json
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- benchmarks/assistance/results/a42_postresult_status.json
          git commit -m "Record A4.2 post-result audit status" || exit 0
          git push origin HEAD:phase4-a42-postresult-audit
