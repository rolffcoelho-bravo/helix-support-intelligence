name: R3.2 Evidence Capture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r32-evidence-capture.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: r32-evidence-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: d13bc04383c8cc59b2cc418fe48c9ef0756b2a6a
      TARGET_WORKFLOW: phase3-retrieval-r32.yml
      CAPTURE_BRANCH: phase3-r32-evidence-capture

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate completed immutable R3.2 run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?event=push&head_sha=${TARGET_SHA}&per_page=10"
          mkdir -p "${RUNNER_TEMP}/r32-capture"
          for attempt in $(seq 1 120); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}" > "${RUNNER_TEMP}/r32-capture/runs.json"
            run_id=$(jq -r '.workflow_runs[0].id // empty' "${RUNNER_TEMP}/r32-capture/runs.json")
            status=$(jq -r '.workflow_runs[0].status // empty' "${RUNNER_TEMP}/r32-capture/runs.json")
            if [[ -n "${run_id}" && "${status}" == "completed" ]]; then
              conclusion=$(jq -r '.workflow_runs[0].conclusion // "unknown"' "${RUNNER_TEMP}/r32-capture/runs.json")
              jq '.workflow_runs[0]' "${RUNNER_TEMP}/r32-capture/runs.json" \
                > "${RUNNER_TEMP}/r32-capture/run.json"
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              echo "conclusion=${conclusion}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 15
          done
          echo "R3.2 run did not reach completed state within the capture window." >&2
          exit 1

      - name: Capture jobs and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/r32-capture"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "${root}/jobs.json"

          artifact_id=""
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error "${headers[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              > "${root}/artifacts.json"
            artifact_id=$(jq -r \
              --arg prefix "phase3-retrieval-r32-${TARGET_SHA}" \
              '.artifacts[] | select(.name | startswith($prefix)) | .id' \
              "${root}/artifacts.json" | head -n 1)
            if [[ -n "${artifact_id}" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "${artifact_id}" ]]; then
            echo "No R3.2 artifact found for run ${RUN_ID}." >&2
            exit 1
          fi
          jq --argjson id "${artifact_id}" '.artifacts[] | select(.id == $id)' \
            "${root}/artifacts.json" > "${root}/artifact.json"
          curl --fail --location --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "${root}/evidence.zip"
          mkdir -p "${root}/evidence"
          unzip -q "${root}/evidence.zip" -d "${root}/evidence"

      - name: Publish captured evidence on isolated branch
        env:
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_CONCLUSION: ${{ steps.locate.outputs.conclusion }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/r32-capture"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "${TARGET_SHA}"
          git switch -C "${CAPTURE_BRANCH}"
          destination="benchmarks/retrieval/evidence_capture/r32"
          mkdir -p "${destination}/metadata" "${destination}/artifact"
          cp "${root}/run.json" "${destination}/metadata/run.json"
          cp "${root}/jobs.json" "${destination}/metadata/jobs.json"
          cp "${root}/artifact.json" "${destination}/metadata/artifact.json"
          cp -a "${root}/evidence/." "${destination}/artifact/"
          printf '%s\n' "run_id=${RUN_ID}" "conclusion=${RUN_CONCLUSION}" \
            "target_sha=${TARGET_SHA}" > "${destination}/metadata/capture.txt"
          git add "${destination}"
          git commit -m "Capture immutable R3.2 execution evidence"
          git push --force origin "HEAD:refs/heads/${CAPTURE_BRANCH}"
