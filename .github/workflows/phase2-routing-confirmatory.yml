name: Phase 2 Routing Confirmatory

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Exact authorization token required to open the frozen BANKING77 confirmatory test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase2-routing-confirmatory
  cancel-in-progress: false

jobs:
  confirmatory:
    name: One-shot frozen Phase 2 confirmatory evaluation
    if: ${{ inputs.authorization == 'OPEN_FROZEN_TEST_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out audited branch state
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Verify confirmatory evaluator and frozen CPU environment
        run: |
          uvx --from ruff==0.16.3 ruff check benchmarks/routing/evaluate_confirmatory.py
          uvx --from ruff==0.16.3 ruff format --check benchmarks/routing/evaluate_confirmatory.py
          test -f benchmarks/routing/evaluate_a2.py.lock
          grep -q 'https://download.pytorch.org/whl/cpu' benchmarks/routing/evaluate_a2.py.lock
          ! grep -Eiq 'name = "(nvidia|cuda|triton)' benchmarks/routing/evaluate_a2.py.lock

      - name: Run no-test preflight
        run: |
          cp benchmarks/routing/evaluate_a2.py.lock benchmarks/routing/evaluate_confirmatory.py.lock
          uv run --locked benchmarks/routing/evaluate_confirmatory.py --preflight-only

      - name: Open frozen test and run registered confirmatory evaluation
        run: >-
          uv run --locked benchmarks/routing/evaluate_confirmatory.py
          --authorize-test-open "${{ inputs.authorization }}"
          --output-dir artifacts/phase2-routing/confirmatory

      - name: Remove transient script lock copy
        if: always()
        run: rm -f benchmarks/routing/evaluate_confirmatory.py.lock

      - name: Publish confirmatory summary
        if: success()
        run: cat artifacts/phase2-routing/confirmatory/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload confirmatory evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-routing-confirmatory-${{ github.sha }}
          path: artifacts/phase2-routing/confirmatory/
          if-no-files-found: error
          retention-days: 90
