# Temporary preflight workflow; removed before merge.
name: R3.3 Lock and Format

on:
  push:
    branches: [phase3-r33-search-integration]
    paths:
      - ".github/workflows/r33-lock-format.yml"

permissions:
  contents: write

jobs:
  lock-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out R3.3 branch
        uses: actions/checkout@v4
        with:
          ref: phase3-r33-search-integration

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"

      - name: Refresh dependency lock
        run: uv lock

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Apply repository Ruff rules
        run: |
          uv run ruff check --fix src/helix_support_intelligence/api tests/test_phase3_search_api.py || true
          uv run ruff format src/helix_support_intelligence/api tests/test_phase3_search_api.py
          uv run ruff check src/helix_support_intelligence/api tests/test_phase3_search_api.py
          uv run ruff format --check src/helix_support_intelligence/api tests/test_phase3_search_api.py

      - name: Run R3.3 tests
        run: uv run pytest tests/test_phase3_search_api.py

      - name: Commit lock and formatting output
        run: |
          if git diff --quiet; then
            echo "No lock or formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock src/helix_support_intelligence/api tests/test_phase3_search_api.py
          git commit -m "Lock and format R3.3 search integration"
          git push origin HEAD:phase3-r33-search-integration
