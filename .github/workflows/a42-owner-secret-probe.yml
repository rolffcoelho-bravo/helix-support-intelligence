name: A4.2 owner secret probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check repository secret presence without exposing value
        run: |
          mkdir -p benchmarks/assistance/results
          if test -n "$OPENAI_API_KEY"; then
            present=true
          else
            present=false
          fi
          printf '{\n  "probe": "a42_owner_dispatched_repository_secret",\n  "openai_api_key_present": %s\n}\n' "$present" \
            > benchmarks/assistance/results/a42_owner_secret_probe.json
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- benchmarks/assistance/results/a42_owner_secret_probe.json
          git commit -m "Record owner-dispatched A4.2 secret probe"
          git push origin HEAD:main

# Temporary operational probe only. It never prints or persists the secret value.
