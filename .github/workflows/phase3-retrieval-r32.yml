name: Phase 3 Retrieval R3.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-retrieval-r32.yml"

permissions:
  contents: read

concurrency:
  group: phase3-retrieval-r32-v1
  cancel-in-progress: false

jobs:
  registered-execution:
    name: Registered B0-B3 retrieval execution and audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out immutable execution commit
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Verify registered pre-execution state
        run: >-
          python3 -c "import json, pathlib;
          p=json.loads(pathlib.Path('configs/models/retrieval_execution_r32_v1.json').read_text());
          assert p['execution_id']=='phase3-retrieval-r3.2-v1';
          assert p['results_opened'] is False"

      - name: Freeze scientific input hashes before first ranking
        run: |
          mkdir -p artifacts/phase3-retrieval/r32
          sha256sum \
            configs/data/helixbank_policy_v1.json \
            configs/models/retrieval_ladder_v1.json \
            configs/models/retrieval_implementation_v1.json \
            configs/models/retrieval_execution_r32_v1.json \
            src/helix_support_intelligence/data/helixbank.py \
            src/helix_support_intelligence/retrieval/core.py \
            src/helix_support_intelligence/retrieval/evaluation.py \
            src/helix_support_intelligence/retrieval/ladder.py \
            benchmarks/retrieval/evaluate_r32.py \
            benchmarks/retrieval/diagnostics_r32.py \
            benchmarks/retrieval/verify_diagnostics_r32.py \
            benchmarks/retrieval/verify_r32.py \
            .github/workflows/phase3-retrieval-r32.yml \
            > artifacts/phase3-retrieval/r32/registered_inputs.sha256

      - name: Execute registered B0-B3 benchmark
        run: >-
          uv run benchmarks/retrieval/evaluate_r32.py
          --output-dir artifacts/phase3-retrieval/r32

      - name: Generate registered diagnostic slices
        run: >-
          python3 benchmarks/retrieval/diagnostics_r32.py
          --output-dir artifacts/phase3-retrieval/r32

      - name: Independently verify diagnostic slices
        run: >-
          python3 benchmarks/retrieval/verify_diagnostics_r32.py
          --output-dir artifacts/phase3-retrieval/r32

      - name: Reverify frozen scientific inputs after execution
        run: sha256sum -c artifacts/phase3-retrieval/r32/registered_inputs.sha256

      - name: Independently reconstruct and audit execution evidence
        run: >-
          python3 benchmarks/retrieval/verify_r32.py
          --output-dir artifacts/phase3-retrieval/r32

      - name: Publish execution summary
        if: always()
        run: |
          if test -f artifacts/phase3-retrieval/r32/report.md; then
            cat artifacts/phase3-retrieval/r32/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f artifacts/phase3-retrieval/r32/post_audit.md; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/phase3-retrieval/r32/post_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable R3.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-retrieval-r32-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/phase3-retrieval/r32/
          if-no-files-found: warn
          retention-days: 90
