name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Diagnose first M6 structural mismatch
        run: |
          uv run python - <<'PY'
          import json
          import runpy

          namespace = runpy.run_path("tests/test_phase4_a45bm6_binding.py")
          core = namespace["_module"](
              "tpag_core_a45bm6_debug", namespace["CORE"]
          )
          builder = namespace["_module"](
              "tpag_calibration_a45bm5_debug", namespace["BUILDER"]
          )
          suite = builder.build_suite()
          scores = namespace["_fake_raw_scores"](core, suite)
          predictions = core.predict_all(suite, scores, 0.9)
          for row, prediction in zip(
              suite["alignment_rows"], predictions["alignments"], strict=True
          ):
              gold = row["gold"]
              if prediction["scope_compatibility"] != gold["scope_compatibility"]:
                  print(
                      json.dumps(
                          {
                              "alignment_id": row["alignment_id"],
                              "subtype": row["subtype"],
                              "claim": row["claim"],
                              "evidence": row["evidence_proposition"],
                              "gold_slot_relations": gold["slot_relations"],
                              "predicted_slot_relations": prediction["slot_relations"],
                              "gold_compatibility": gold["scope_compatibility"],
                              "predicted_compatibility": prediction[
                                  "scope_compatibility"
                              ],
                          },
                          indent=2,
                          sort_keys=True,
                      )
                  )
                  break
          PY

      - name: Run release-blocking checks
        run: make quality
