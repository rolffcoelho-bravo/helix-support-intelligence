name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  observe-a45bm6:
    name: Observe A4.5b-M6 push run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate exact M6 push workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          sha = "6a2d77a2ff0a219197dd3acdd58aaaac82f6794d"
          url = f"https://api.github.com/repos/rolffcoelho-bravo/helix-support-intelligence/actions/runs?head_sha={sha}&per_page=20"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          runs = [
              {
                  "id": run["id"],
                  "name": run["name"],
                  "event": run["event"],
                  "status": run["status"],
                  "conclusion": run["conclusion"],
                  "head_sha": run["head_sha"],
                  "run_attempt": run["run_attempt"],
              }
              for run in payload.get("workflow_runs", [])
          ]
          print(json.dumps(runs, indent=2, sort_keys=True))
          PY
