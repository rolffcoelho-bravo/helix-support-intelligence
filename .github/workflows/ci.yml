name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Canonicalize M6 Python on its source branch
        if: github.event_name == 'pull_request' && github.head_ref == 'phase4-a45bm6-tpag-binding-calibration'
        run: |
          uv run ruff check --fix \
            benchmarks/assistance/calibrate_tpag_a45bm6.py \
            benchmarks/assistance/tpag_core_a45bm6.py \
            benchmarks/assistance/verify_calibration_a45bm6.py \
            scripts/preflight_phase4_a45bm6.py \
            tests/test_phase4_a45bm6_binding.py
          uv run ruff format \
            benchmarks/assistance/calibrate_tpag_a45bm6.py \
            benchmarks/assistance/tpag_core_a45bm6.py \
            benchmarks/assistance/verify_calibration_a45bm6.py \
            scripts/preflight_phase4_a45bm6.py \
            tests/test_phase4_a45bm6_binding.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            benchmarks/assistance/calibrate_tpag_a45bm6.py \
            benchmarks/assistance/tpag_core_a45bm6.py \
            benchmarks/assistance/verify_calibration_a45bm6.py \
            scripts/preflight_phase4_a45bm6.py \
            tests/test_phase4_a45bm6_binding.py
          if ! git diff --cached --quiet; then
            git commit -m "Canonicalize A4.5b-M6 Python formatting"
            git push origin HEAD:phase4-a45bm6-tpag-binding-calibration
          fi

      - name: Run release-blocking checks
        run: make quality
