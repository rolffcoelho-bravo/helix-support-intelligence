name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out erratum source branch
        uses: actions/checkout@v4
        with:
          ref: phase4-a45bm5-preinference-erratum

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Install locked environment
        run: uv sync --locked --group dev

      - name: Apply deterministic M5 pre-inference erratum
        run: uv run python scripts/_tmp_repair_a45bm5_fixture.py

      - name: Canonicalize repaired source
        run: |
          uv run ruff format \
            benchmarks/assistance/tpag_calibration_a45bm5.py \
            tests/test_phase4_a45bm5_calibration_protocol.py \
            scripts/_tmp_repair_a45bm5_fixture.py
          uv run ruff check --fix \
            benchmarks/assistance/tpag_calibration_a45bm5.py \
            tests/test_phase4_a45bm5_calibration_protocol.py \
            scripts/_tmp_repair_a45bm5_fixture.py
          uv run ruff format \
            benchmarks/assistance/tpag_calibration_a45bm5.py \
            tests/test_phase4_a45bm5_calibration_protocol.py \
            scripts/_tmp_repair_a45bm5_fixture.py
          uv run ruff check \
            benchmarks/assistance/tpag_calibration_a45bm5.py \
            tests/test_phase4_a45bm5_calibration_protocol.py \
            scripts/_tmp_repair_a45bm5_fixture.py

      - name: Commit repaired frozen fixture and erratum record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            benchmarks/assistance/tpag_calibration_a45bm5.py \
            benchmarks/assistance/a45bm5_manifest_v1.json \
            benchmarks/assistance/a45bm5_erratum_v1.json \
            configs/models/assistance_grounding_a45bm5_v1.json \
            docs/assistance-a45bm5-tpag-calibration-protocol.md \
            tests/test_phase4_a45bm5_calibration_protocol.py
          git commit -m "Correct A4.5b-M5 predicate paraphrase fixture isolation"
          git push origin HEAD:phase4-a45bm5-preinference-erratum
