name: A4.3a protocol lock binding

on:
  push:
    branches:
      - phase4-a43a-validity-protocol
    paths:
      - ".github/workflows/a43a-format.yml"

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-a43a-validity-protocol
      - name: Align evaluator script dependencies with frozen A4.1 lock
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("benchmarks/assistance/evaluate_grounding_a43a.py")
          text = path.read_text(encoding="utf-8")
          marker = '# dependencies = [\n'
          dependency = '#   "httpx>=0.28,<1",\n'
          if dependency not in text:
              if marker not in text:
                  raise SystemExit("PEP 723 dependency block not found")
              text = text.replace(marker, marker + dependency, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cp benchmarks/assistance/runtime_a41.py.lock \
            benchmarks/assistance/evaluate_grounding_a43a.py.lock
          cmp benchmarks/assistance/runtime_a41.py.lock \
            benchmarks/assistance/evaluate_grounding_a43a.py.lock
      - name: Commit dependency alignment and exact lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            benchmarks/assistance/evaluate_grounding_a43a.py \
            benchmarks/assistance/evaluate_grounding_a43a.py.lock
          git commit -m "Bind A4.3a evaluator dependency lock" || exit 0
          git push origin HEAD:phase4-a43a-validity-protocol
