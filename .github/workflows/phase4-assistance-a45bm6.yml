name: Phase 4 Assistance A4.5b-M6 TPAG Calibration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-assistance-a45bm6.yml"

permissions:
  contents: read

concurrency:
  group: phase4-assistance-a45bm6-tpag-calibration-v1
  cancel-in-progress: false

jobs:
  registered-tpag-calibration-only:
    name: Frozen TPAG calibration-only execution and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out immutable execution commit with predecessor
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce exact M6 scientific lineage and diff
        run: |
          test "$(git rev-parse HEAD^)" = "1ac85b123a4804e5cc6f9b74662ff04fd9ef198b"
          cat > /tmp/a45bm6-expected-files.txt <<'EOF'
          .github/workflows/phase4-assistance-a45bm6.yml
          Makefile
          benchmarks/assistance/calibrate_tpag_a45bm6.py
          benchmarks/assistance/tpag_core_a45bm6.py
          benchmarks/assistance/verify_calibration_a45bm6.py
          configs/models/assistance_grounding_a45bm6_v1.json
          docs/assistance-a45bm6-tpag-binding-calibration.md
          scripts/preflight_phase4_a45bm6.py
          tests/test_phase4_a45bm6_binding.py
          EOF
          git diff --name-only HEAD^ HEAD | sort > /tmp/a45bm6-actual-files.txt
          diff -u /tmp/a45bm6-expected-files.txt /tmp/a45bm6-actual-files.txt

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Install repository quality environment
        run: uv sync --locked --group dev

      - name: Verify A4.5b-M6 calibration-only pre-execution state
        run: uv run python scripts/preflight_phase4_a45bm6.py

      - name: Resolve and freeze A4.5b-M6 scientific runtime
        run: uv lock --script benchmarks/assistance/calibrate_tpag_a45bm6.py

      - name: Freeze registered scientific inputs before inference
        run: |
          mkdir -p artifacts/phase4-assistance/a45bm6
          sha256sum \
            configs/models/assistance_grounding_a45bm5_v1.json \
            configs/models/assistance_grounding_a45bm6_v1.json \
            benchmarks/assistance/a45bm5_manifest_v1.json \
            benchmarks/assistance/tpag_calibration_a45bm5.py \
            benchmarks/assistance/tpag_core_a45bm6.py \
            benchmarks/assistance/calibrate_tpag_a45bm6.py \
            benchmarks/assistance/calibrate_tpag_a45bm6.py.lock \
            benchmarks/assistance/verify_calibration_a45bm6.py \
            scripts/preflight_phase4_a45bm6.py \
            .github/workflows/phase4-assistance-a45bm6.yml \
            > artifacts/phase4-assistance/a45bm6/registered_inputs.sha256
          cp benchmarks/assistance/calibrate_tpag_a45bm6.py.lock \
            artifacts/phase4-assistance/a45bm6/resolved_environment.lock

      - name: Execute frozen TPAG calibration-only stage
        run: >-
          uv run --locked --with "protobuf==6.33.6"
          benchmarks/assistance/calibrate_tpag_a45bm6.py
          --output-dir artifacts/phase4-assistance/a45bm6

      - name: Reverify frozen scientific inputs after execution
        run: sha256sum -c artifacts/phase4-assistance/a45bm6/registered_inputs.sha256

      - name: Reconstruct all registered parameter arithmetic
        run: >-
          python3 benchmarks/assistance/verify_calibration_a45bm6.py
          --output-dir artifacts/phase4-assistance/a45bm6

      - name: Freeze artifact checksums
        run: |
          find artifacts/phase4-assistance/a45bm6 -maxdepth 1 -type f \
            ! -name checksums.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > artifacts/phase4-assistance/a45bm6/checksums.sha256
          sha256sum -c artifacts/phase4-assistance/a45bm6/checksums.sha256

      - name: Publish execution summary
        if: always()
        run: |
          if test -f artifacts/phase4-assistance/a45bm6/report.md; then
            cat artifacts/phase4-assistance/a45bm6/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f artifacts/phase4-assistance/a45bm6/post_audit.md; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/phase4-assistance/a45bm6/post_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable A4.5b-M6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase4-assistance-a45bm6-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/phase4-assistance/a45bm6/
          if-no-files-found: warn
          retention-days: 90
