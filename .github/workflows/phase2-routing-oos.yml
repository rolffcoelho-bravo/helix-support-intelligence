name: Phase 2 Routing OOS

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase2-routing-oos.yml"
      - "benchmarks/routing/evaluate_oos.py"
      - "benchmarks/routing/evaluate_oos.py.lock"
      - "benchmarks/routing/evaluate_calibration.py"
      - "benchmarks/routing/evaluate_calibration.py.lock"
      - "benchmarks/routing/results/a0_a1_validation_v1.json"
      - "benchmarks/routing/results/a2_validation_v2.json"
      - "configs/data/banking77.json"
      - "configs/models/routing_a2.json"
      - "configs/models/routing_calibration.json"
      - "configs/models/routing_oos.json"
      - "data/oos/routing_oos_v1.json"
      - "src/helix_support_intelligence/data/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-routing-oos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oos-validation:
    name: Frozen OOS benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Verify frozen OOS source and CPU-only lock
        run: |
          uvx --from ruff==0.16.3 ruff check benchmarks/routing/evaluate_oos.py
          uvx --from ruff==0.16.3 ruff format --check benchmarks/routing/evaluate_oos.py
          test -f benchmarks/routing/evaluate_oos.py.lock
          grep -q 'https://download.pytorch.org/whl/cpu' benchmarks/routing/evaluate_oos.py.lock
          ! grep -Eiq 'name = "(nvidia|cuda|triton)' benchmarks/routing/evaluate_oos.py.lock

      - name: Run frozen OOS benchmark
        run: >-
          uv run --locked benchmarks/routing/evaluate_oos.py
          --output-dir artifacts/phase2-routing/oos

      - name: Publish OOS summary
        run: cat artifacts/phase2-routing/oos/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-routing-oos-${{ github.sha }}
          path: artifacts/phase2-routing/oos/
          if-no-files-found: error
          retention-days: 14
