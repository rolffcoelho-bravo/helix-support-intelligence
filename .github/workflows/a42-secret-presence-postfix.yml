name: A4.2 secret presence post-fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/a42-secret-presence-postfix.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check exact repository secret presence
        id: check
        run: |
          mkdir -p benchmarks/assistance/results
          if test -n "$OPENAI_API_KEY"; then
            present=true
          else
            present=false
          fi
          printf '{\n  "probe": "a42_repository_secret_postfix",\n  "openai_api_key_present": %s\n}\n' "$present" > benchmarks/assistance/results/a42_secret_presence_postfix.json
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - name: Commit probe result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- benchmarks/assistance/results/a42_secret_presence_postfix.json
          git commit -m "Record post-fix A4.2 secret presence probe" || true
          git push origin HEAD:main || true
      - name: Fail if secret unavailable
        if: steps.check.outputs.present != 'true'
        run: exit 1

# Temporary operational probe only. It never prints or persists the secret value.
