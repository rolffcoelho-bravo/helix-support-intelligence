name: A4.2 recovery observer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/a42-recovery-observer.yml"

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD_SHA: 0cfe1edd7fe955a5d0ce57b8f68df2b8c183afb9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait for frozen A4.2 recovery execution
        run: |
          set -euo pipefail
          mkdir -p benchmarks/assistance/results
          run_id=""
          conclusion=""
          status=""
          for i in $(seq 1 120); do
            data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/a42-owner-secret-probe.yml/runs?per_page=20")"
            run_id="$(printf '%s' "$data" | jq -r --arg sha "$TARGET_HEAD_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -n1)"
            if test -n "$run_id"; then
              status="$(printf '%s' "$data" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id==$id) | .status')"
              conclusion="$(printf '%s' "$data" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id==$id) | (.conclusion // "")')"
              if test "$status" = "completed"; then
                break
              fi
            fi
            sleep 30
          done
          if test -z "$run_id" || test "$status" != "completed"; then
            echo "Timed out waiting for recovery execution." >&2
            exit 1
          fi
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
          artifact_count="$(printf '%s' "$artifacts" | jq '.total_count')"
          artifact_id="$(printf '%s' "$artifacts" | jq -r '.artifacts[0].id // empty')"
          artifact_name="$(printf '%s' "$artifacts" | jq -r '.artifacts[0].name // empty')"
          jq -n \
            --arg target_head_sha "$TARGET_HEAD_SHA" \
            --argjson run_id "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --argjson artifact_count "$artifact_count" \
            --arg artifact_id "$artifact_id" \
            --arg artifact_name "$artifact_name" \
            '{observer:"a42_frozen_recovery", target_head_sha:$target_head_sha, run_id:$run_id, status:$status, conclusion:$conclusion, artifact_count:$artifact_count, artifact_id:$artifact_id, artifact_name:$artifact_name}' \
            > benchmarks/assistance/results/a42_recovery_observer.json
      - name: Commit observer metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -- benchmarks/assistance/results/a42_recovery_observer.json
          git commit -m "Record A4.2 recovery execution metadata"
          git push origin HEAD:main

# Temporary observer only. It does not execute or modify the scientific benchmark.
