name: Temporary A4.5b-M3 Retry Observer

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-a45bm3-retry-observer.yml"

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9521c6dda9ea16eb3cccc91f1a7178064999c32b
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate exact M3 retry push workflow
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&event=push&per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          rows = [
              {
                  "id": run["id"],
                  "name": run["name"],
                  "status": run["status"],
                  "conclusion": run["conclusion"],
                  "event": run["event"],
                  "head_sha": run["head_sha"],
                  "run_number": run["run_number"],
                  "run_attempt": run["run_attempt"],
              }
              for run in payload.get("workflow_runs", [])
          ]
          print(json.dumps(rows, indent=2, sort_keys=True))
          if not rows:
              raise SystemExit("No push workflow run found for exact M3 retry SHA")
          PY
